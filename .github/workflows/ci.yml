# Continuous integration for Foveacast.
#
# Runs the Vitest suite on every pull request and every push so a broken
# main branch never ships to GitHub Pages silently. The deploy workflow
# (deploy.yml) has its own trigger on `push` to main and does not
# re-run these tests — if you want the deploy gated on tests, either
# add a needs: relationship or keep relying on branch-protection rules
# that require this workflow to pass before merge.
#
# Node 22 is the current Active LTS. Node 20 reached end-of-life
# 2026-04-30 and was dropped. For a buildless static site the test
# suite is the only Node consumer, so a single LTS target is enough.

name: CI

on:
  pull_request:
  push:

jobs:
  test:
    name: vitest (node ${{ matrix.node }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node: [22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm must be installed before setup-node, otherwise the
      # pnpm-cache option below has nothing to cache against.
      #
      # Version is intentionally omitted here: package.json carries
      # `packageManager: pnpm@10...`, which the action reads and
      # honours. Specifying `version:` as well would conflict with
      # the packageManager field and fail with
      # `ERR_PNPM_BAD_PM_VERSION`.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      # --frozen-lockfile is the point of having a lockfile: reject
      # any install that would change it. A green CI run then proves
      # the exact dependency graph in the lockfile works on the tested
      # Node versions, not "some compatible graph near it".
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test
